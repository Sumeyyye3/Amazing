[tool.poetry]
name = "mazegen"
version = "1.0.0"
description = "Reusable maze generator package (Kruskal/Union-Find perfect mazes, Pac-Man-style playable boards, BFS shortest-path, and config parsing)"
authors = [
    "Sumeyye Dogan <sumdogan@student.42kocaeli.com.tr>",
    "Baris Sakalli <basakall@student.42Kocaeli.com.tr>"
]
readme = "README.md"
packages = [
    { include = "kruskal" },
    { include = "pathfinder" },
    { include = "parse" },
    { include = "print_maze_txt.py" },
    { include = "fourty_two.py" },
    { include = "generate_false.py" },
    { include = "maze_generate.py" },
    { include = "maze_menu.py"}
]
exclude = [
    "kruskal/*.pdf",
    "parse/*.pdf"
]


[tool.poetry.dependencies]
python = "^3.10"

[tool.poetry.group.dev.dependencies]
flake8 = "^7.0"
mypy = "^1.0"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
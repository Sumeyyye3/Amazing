[tool.poetry]
name = "a_maze_ing"
version = "1.0.0"
description = "Reusable maze generator package using Kruskal algorithm"
authors = [
    "Sumeyye Dogan <sumdogan@student.42kocaeli.com.tr>",
    "Baris Sakalli <basakall@student.42Kocaeli.com.tr>"
]
readme = "README.md"
packages = [
    { include = "kruskal" },
    { include = "pathfinder" }
]


[tool.poetry.dependencies]
python = "^3.10"

[tool.poetry.group.dev.dependencies]
flake8 = "^7.0"
mypy = "^1.0"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
